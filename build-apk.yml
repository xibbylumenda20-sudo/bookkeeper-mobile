name: Build Bookkeeper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Cordova
        run: npm install -g cordova
      - name: Create Android wrapper
        run: |
          rm -rf buildapp
          cordova create buildapp com.bookkeeper.mobile "Bookkeeper Mobile"
          cp -r app/. buildapp/www/
          cd buildapp
          cordova platform add android
          cordova build android --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-debug-apk
          path: buildapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
